name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project if uploaded as zip
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            z=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then echo "Unzipping $z"; unzip -o -q "$z" -d unzipped_project; fi
          fi

      - name: Locate Gradle project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$f")"

      - name: Patch Gradle packaging
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if ! grep -q pickFirsts app/build.gradle.kts; then
            sed -i 's|^    packaging {|    packaging {\n        resources.pickFirsts += setOf("baksmali.properties", "smali.properties", "dexlib2.properties", "util.properties", "*.properties")|' app/build.gradle.kts
          fi
          grep -n -A2 "packaging {" app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo "### Build errors"
            echo '```'
            grep -nE "^e: |error:|What went wrong|Execution failed|Duplicate class|Could not " -A4 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaleedDexLab-debug
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
